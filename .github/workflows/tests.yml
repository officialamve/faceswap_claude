name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts tests
      - run: ruff check --select F app scripts tests
      - run: pytest -q          # unit tests only: no model weights, no Telegram credentials
      - name: Validate .env.example parses as placeholders
        run: python -c "import re,sys; t=open('.env.example').read(); sys.exit(1 if re.search(r'\d{8,}:[A-Za-z0-9_-]{30,}', t) else 0)"
